services:
  - type: web
    name: pact-agentic-commerce
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn pact.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: SELLER_SANDBOX_EMAIL
        sync: false
      - key: BUYER_SANDBOX_EMAIL
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: LLM_MODEL
        value: gpt-4o-mini
      - key: BOND_PERCENT
        value: "20"
